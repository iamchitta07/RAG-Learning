    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.3",
    "langchain-pinecone>=0.2.13",
    "langgraph",
    "langgraph-cli[inmem]>=0.4.31",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
